<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Pro Infinity | Official Health Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1; --secondary: #a855f7; --accent: #00d2ff;
            --water: #3b82f6; --bg: #0f172a; --text: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.1);
        }
        .light-mode { --bg: #f8fafc; --text: #1e293b; --glass: rgba(255, 255, 255, 0.6); --glass-border: rgba(0, 0, 0, 0.05); }
        .neon-mode { --bg: #050505; --text: #00ff41; --primary: #00ff41; --secondary: #008f11; --glass: rgba(0, 255, 65, 0.05); --glass-border: #00ff41; }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: all 0.5s ease; min-height: 100vh; overflow-x: hidden; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .container { max-width: 1100px; margin: auto; position: relative; z-index: 1; padding: 10px; }

        .glass-card { 
            background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); 
            border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }

        /* WATER ANIMATION */
        .bottle { width: 60px; height: 100px; border: 3px solid rgba(255,255,255,0.2); margin: 15px auto; border-radius: 12px; overflow: hidden; position: relative; background: rgba(0, 0, 0, 0.2); }
        .wave-wrapper { position: absolute; bottom: 0; width: 100%; height: 0%; transition: height 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--water); box-shadow: 0 0 20px var(--water); }
        
        input, select, button { border-radius: 15px; padding: 12px; font-family: inherit; margin-bottom: 10px; width: 100%; border: none; }
        select, input { background: var(--glass); color: var(--text); border: 1px solid var(--glass-border); }
        button { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        
        #mealImage { width: 100%; border-radius: 20px; display: none; margin-top: 15px; max-height: 250px; object-fit: cover; border: 1px solid var(--glass-border); }
        
        /* PROGRESS UI */
        .xp-bar { height: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid var(--glass-border); }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--secondary)); transition: 0.8s ease; width: 0%; }
        
        #stepsContainer, #shopListContainer { display: none; text-align: left; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 20px; font-size: 0.9rem; border: 1px solid var(--glass-border); }
        
        .badge-grid { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
        .badge { width: 40px; height: 40px; background: var(--glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0.2; grayscale: 1; transition: 0.5s; font-size: 1.2rem; }
        .badge.active { opacity: 1; grayscale: 0; background: var(--secondary); box-shadow: 0 0 15px var(--secondary); }

        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--primary); padding: 15px 30px; border-radius: 50px; color: white; transition: 0.5s; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #toast.active { bottom: 40px; }
        .chart-container { width: 160px; height: 160px; margin: auto; }
    </style>
</head>
<body class="dark-mode">

<canvas id="particleCanvas"></canvas>
<div id="toast">LEVEL UP! 🚀</div>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0;">
        <h1 style="margin:0; font-weight: 800; letter-spacing: -3px; font-size: 2.5rem;">MEAL<span style="color: var(--primary)">PRO</span></h1>
        <div style="display: flex; gap: 8px;">
            <button onclick="toggleTheme()" style="width: auto; padding: 10px 15px;">🌓</button>
            <button id="neonBtn" onclick="toggleNeon()" style="width: auto; padding: 10px 15px; display: none;">🟢</button>
            <button onclick="clearData()" style="width: auto; padding: 10px 15px; background: #ef4444;">🗑️</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="glass-card" style="text-align: center;">
            <h3 style="margin-top:0">Goal Progress</h3>
            <div class="chart-container"><canvas id="goalChart"></canvas></div>
            <p style="font-weight: 600; margin-top: 10px;"><span id="cals">0</span> / 2000 kcal</p>
        </div>

        <div class="glass-card" style="text-align: center;">
            <h3 style="margin-top:0">Hydration</h3>
            <div class="bottle"><div id="waterWrapper" class="wave-wrapper"></div></div>
            <p><span id="waterCount">0</span>/8 glasses</p>
            <button onclick="addWater()">+ Drink Water</button>
        </div>

        <div class="glass-card">
            <h3 style="margin-top:0">Rank: <span id="rank">Rookie</span></h3>
            <h2 style="margin: 5px 0; font-weight: 800; color: var(--accent);">LVL <span id="lvl">1</span></h2>
            <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
            <p style="font-size: 0.8rem; margin-top: 8px; opacity: 0.8;">XP: <span id="xpText">0</span>/100</p>
            <div class="badge-grid">
                <div id="badge-1" class="badge" title="Hydrated">💧</div>
                <div id="badge-2" class="badge" title="Healthy Eater">🥗</div>
                <div id="badge-3" class="badge" title="Goal Setter">🔥</div>
            </div>
        </div>
    </div>

    <div class="glass-card">
        <h3>🍳 Smart Meal Generator</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="mType" style="flex: 2; margin:0">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="balanced">Balanced (Full Meals)</option>
            </select>
            <button onclick="getMeal()" style="flex: 1; margin:0">Generate</button>
        </div>
        <div id="mDisplay" style="text-align: center;">
            <h2 id="mName" style="margin-bottom: 10px;"></h2>
            <img id="mealImage">
            <button id="stepBtn" onclick="toggleSteps()" style="display:none; margin-top:15px; background:none; border:1px solid var(--primary); font-size:0.8rem; width: auto; padding: 8px 20px;">Show Recipe</button>
            <div id="stepsContainer"></div>
        </div>
    </div>

    <div class="glass-card">
        <h3>🛒 Smart Shopping List</h3>
        <p style="font-size: 0.8rem; opacity: 0.7;">Ingredients from your generated meals:</p>
        <div id="shopListContainer" style="display: block;">
            <ul id="shoppingItems" style="padding-left: 20px; margin: 0;">
                <li style="opacity:0.5">Generate a meal to build your list...</li>
            </ul>
        </div>
        <button onclick="clearShopList()" style="margin-top: 15px; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--glass-border); font-size: 0.8rem;">Clear List</button>
    </div>
</div>

<script>
    // --- COMPREHENSIVE MEAL DATABASE ---
    const meals = {
        breakfast: [
            {n:"Avocado Toast", c:320, ing:["Bread", "Avocado", "Chili Flakes"], img:"https://images.unsplash.com/photo-1525351484163-7529414344d8?w=500", steps: ["Toast bread.", "Mash avocado with salt/pepper.", "Top with chili flakes."]},
            {n:"Protein Pancakes", c:420, ing:["Oats", "Protein Powder", "Egg"], img:"https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?w=500", steps: ["Mix oats, powder, and egg.", "Cook on pan 2 mins per side.", "Top with berries."]},
            {n:"Shakshuka", c:350, ing:["Eggs", "Tomatoes", "Cumin", "Onion"], img:"https://images.unsplash.com/photo-1590412200988-a436bb7050a8?w=500", steps: ["Sauté onions/spices.", "Add tomatoes and simmer.", "Crack eggs in and cover until set."]}
        ],
        lunch: [
            {n:"Quinoa Bowl", c:450, ing:["Quinoa", "Cucumber", "Feta", "Lemon"], img:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500", steps: ["Boil quinoa.", "Chop cucumber and feta.", "Toss with lemon and oil."]},
            {n:"Chicken Wrap", c:550, ing:["Tortilla", "Chicken Breast", "Spinach"], img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500", steps: ["Grill chicken.", "Assemble with spinach in tortilla.", "Roll tightly."]}
        ],
        dinner: [
            {n:"Salmon & Asparagus", c:500, ing:["Salmon", "Asparagus", "Lemon"], img:"https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=500", steps: ["Season salmon.", "Roast with asparagus at 200°C.", "Serve with lemon."]},
            {n:"Beef Stir-fry", c:600, ing:["Beef Strips", "Broccoli", "Soy Sauce", "Rice"], img:"https://images.unsplash.com/photo-1512058560566-d8d437af2d36?w=500", steps: ["Sauté beef.", "Add broccoli and soy sauce.", "Serve over rice."]}
        ],
        balanced: [
            {n:"Steak & Sweet Potato", c:680, ing:["Steak", "Sweet Potato", "Kale"], img:"https://images.unsplash.com/photo-1546964124-0cce460f38ef?w=500", steps: ["Bake sweet potato.", "Sear steak 4 mins per side.", "Sauté kale."]},
            {n:"Mediterranean Bowl", c:610, ing:["Hummus", "Falafel", "Rice", "Olives"], img:"https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=500", steps: ["Base of rice.", "Add hummus, falafel, and olives.", "Top with tahini."]}
        ]
    };

    // --- APP STATE & PERSISTENCE ---
    let state = JSON.parse(localStorage.getItem('mealProData')) || {
        cals: 0, water: 0, xp: 0, lvl: 1, goal: 2000, shopping: []
    };

    let goalChart;

    function save() {
        localStorage.setItem('mealProData', JSON.stringify(state));
        updateUI();
    }

    // --- UI UPDATES ---
    function initChart() {
        const ctx = document.getElementById('goalChart').getContext('2d');
        goalChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [state.cals, Math.max(0, state.goal - state.cals)],
                    backgroundColor: ['#6366f1', 'rgba(255,255,255,0.05)'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: { cutout: '85%', plugins: { tooltip: { enabled: false } } }
        });
    }

    function updateUI() {
        document.getElementById('cals').innerText = state.cals;
        document.getElementById('waterCount').innerText = state.water;
        document.getElementById('waterWrapper').style.height = (state.water * 12.5) + '%';
        document.getElementById('lvl').innerText = state.lvl;
        document.getElementById('xpText').innerText = state.xp;
        document.getElementById('xpFill').style.width = state.xp + '%';
        
        // Rank & Neon Toggle
        document.getElementById('rank').innerText = state.lvl > 5 ? "Athlete" : "Rookie";
        if(state.lvl >= 3) document.getElementById('neonBtn').style.display = "inline-block";

        // Badges
        if(state.water >= 8) document.getElementById('badge-1').classList.add('active');
        if(state.cals > 1000) document.getElementById('badge-2').classList.add('active');
        if(state.lvl >= 2) document.getElementById('badge-3').classList.add('active');

        // Shopping List
        const list = document.getElementById('shoppingItems');
        if(state.shopping.length > 0) {
            list.innerHTML = state.shopping.map(i => `<li>${i}</li>`).join('');
        }

        if(goalChart) {
            goalChart.data.datasets[0].data = [state.cals, Math.max(0, state.goal - state.cals)];
            goalChart.update();
        }
    }

    // --- CORE LOGIC ---
    function addWater() {
        if(state.water < 8) {
            state.water++;
            addXP(15);
            save();
        } else { showToast("Fully Hydrated! 💧"); }
    }

    function getMeal() {
        const type = document.getElementById('mType').value;
        const meal = meals[type][Math.floor(Math.random() * meals[type].length)];
        
        document.getElementById('mName').innerText = meal.n;
        const img = document.getElementById('mealImage');
        img.src = meal.img; img.style.display = "block";
        
        state.cals += meal.c;
        
        // Add unique ingredients to shop list
        meal.ing.forEach(item => {
            if(!state.shopping.includes(item)) state.shopping.push(item);
        });

        document.getElementById('stepBtn').style.display = "inline-block";
        document.getElementById('stepsContainer').style.display = "none";
        document.getElementById('stepsContainer').innerHTML = `<p><strong>Brief Steps:</strong></p><ul>${meal.steps.map(s => `<li>${s}</li>`).join('')}</ul>`;
        
        addXP(35);
        save();
    }

    function addXP(amt) {
        state.xp += amt;
        if(state.xp >= 100) {
            state.lvl++;
            state.xp = 0;
            showToast("LEVEL UP! 🚀");
        }
        save();
    }

    function toggleSteps() {
        const c = document.getElementById('stepsContainer');
        c.style.display = c.style.display === "none" ? "block" : "none";
    }

    function clearShopList() { state.shopping = []; save(); location.reload(); }
    function clearData() { if(confirm("Clear all data and progress?")) { localStorage.clear(); location.reload(); } }
    function showToast(msg) {
        const t = document.getElementById('toast'); t.innerText = msg;
        t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 3000);
    }

    function toggleTheme() { document.body.className = document.body.className === 'light-mode' ? 'dark-mode' : 'light-mode'; }
    function toggleNeon() { document.body.className = 'neon-mode'; }

    // Init App
    window.onload = () => { initChart(); updateUI(); animate(); };

    // --- BACKGROUND PARTICLES ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "rgba(99, 102, 241, 0.1)";
        for(let i=0; i<40; i++) {
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1.5, 0, Math.PI*2);
            ctx.fill();
        }
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
