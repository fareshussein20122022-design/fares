<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN OMNI | ULTIMA COHESION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1; --secondary: #ff00ff; --accent: #00d2ff;
            --water: #0080ff; --bg: #000; --text: #fff;
            --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #ffcc00; --hp: #ff0055; --shard: #00ffaa;
            --hue: 280deg; /* Dynamic Hue Variable */
        }

        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 15px; overflow-x: hidden;
            background: radial-gradient(circle at center, hsl(var(--hue), 30%, 5%) 0%, #000 100%);
            min-height: 100vh; cursor: crosshair; transition: background 1s ease;
        }

        /* 30+ DESIGN ENHANCEMENTS: SCANLINES, NOISE, & FILTERS */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 2px, 3px 100%; z-index: 1000; pointer-events: none;
        }

        .drippy-header { 
            font-family: 'Syncopate', sans-serif; font-size: 3.5rem; text-align: center;
            background: linear-gradient(to right, #fff, var(--accent), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--accent)); margin-bottom: 0;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .layout { display: grid; grid-template-columns: 360px 1fr 360px; gap: 20px; max-width: 1800px; margin: auto; }
        @media (max-width: 1350px) { .layout { grid-template-columns: 1fr; } }

        /* ADVANCED GLASSMORPHISM */
        .glass-card { 
            background: var(--glass); backdrop-filter: blur(50px); 
            border: 1px solid var(--glass-border); border-radius: 40px; 
            padding: 30px; position: relative; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .glass-card:hover { border-color: var(--accent); transform: scale(1.01); box-shadow: 0 0 30px rgba(0, 210, 255, 0.15); }

        /* ARTIFACT SYSTEM */
        .artifact-vortex { 
            position: absolute; width: 50px; height: 50px; border: 2px solid var(--shard);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morph 3s linear infinite; filter: drop-shadow(0 0 15px var(--shard));
            display: none; pointer-events: none;
        }
        @keyframes morph { 0%, 100% { border-radius: 30% 70% 70% 30%; } 50% { border-radius: 70% 30% 30% 70%; transform: rotate(180deg); } }

        /* BARS & METRICS */
        .bar-wrap { height: 12px; background: rgba(0,0,0,0.5); border-radius: 20px; border: 1px solid #222; overflow: hidden; margin: 10px 0; }
        .bar-fill { height: 100%; transition: 1s cubic-bezier(0.1, 1, 0.1, 1); width: 0%; }

        /* UI BUTTONS */
        button { 
            background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 15px; font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: var(--secondary); color: #000; box-shadow: 0 0 20px var(--secondary); }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 20px 40px; border-radius: 50px; font-weight: 900; z-index: 2000; display: none; font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div id="toast">SYSTEM INITIALIZED</div>

<div class="container">
    <header style="padding: 40px 0;">
        <h1 class="drippy-header">TITAN OMNI</h1>
        <div style="text-align:center; font-family:'Orbitron'; font-size:0.8rem; letter-spacing:12px; opacity:0.6;">
            [ PRESTIGE: <span id="preVal">0</span> // SHARDS: <span id="shaVal" style="color:var(--shard)">0</span> ]
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="glass-card">
                <h3>🔱 SKILL TREE</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;" id="skillGrid">
                    <button onclick="buySkill('S1', 500)">DMG+</button>
                    <button onclick="buySkill('S2', 500)">XP+</button>
                </div>
            </div>

            <div class="glass-card">
                <h3>🎒 INVENTORY</h3>
                <div id="invGrid" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
                    </div>
            </div>

            <div class="glass-card">
                <h3>⚔️ WORLD EVENT</h3>
                <div id="eventTimer" style="color:var(--hp); font-weight:900;">NEXT EVENT: 04:00:00</div>
                <div class="bar-wrap"><div id="eventHp" class="bar-fill" style="background:var(--hp);"></div></div>
            </div>
        </aside>

        <main>
            <div class="glass-card" style="text-align:center;">
                <div id="vortex" class="artifact-vortex"></div>
                <h3>CORE SINGULARITY</h3>
                <div style="height: 280px; position: relative;">
                    <canvas id="coreChart"></canvas>
                    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
                        <h1 id="cals" style="font-size: 3.5rem; margin:0;">0</h1>
                        <small>KCAL</small>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <h3>🧬 BIO-DECODER</h3>
                <input type="text" id="aiInput" placeholder="Input Neural Stream..." style="background:#000; border:1px solid #333; color:white; padding:18px; width:calc(100% - 38px); border-radius:18px; margin-bottom:12px; font-family:'Orbitron';">
                <button onclick="processData()" style="width:100%; background:var(--accent); color:#000;">DECODE</button>
            </div>
        </main>

        <aside>
            <div class="glass-card">
                <h3>LVL <span id="lvl">1</span></h3>
                <div class="bar-wrap"><div id="xpFill" class="bar-fill" style="background:var(--secondary);"></div></div>
                <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                    <span id="xpDisplay">0 XP</span>
                    <span>NEXT: 2500</span>
                </div>
                <button id="presBtn" onclick="doPrestige()" style="margin-top:15px; border-color:var(--gold); color:var(--gold); display:none;">ASCEND TIMELINE</button>
            </div>

            <div class="glass-card" style="border-color:var(--hp);">
                <h3>BOSS: <span id="bossName">ARCH-REAPER</span></h3>
                <div id="bossSprite" style="font-size:4rem; text-align:center;">💀</div>
                <div class="bar-wrap"><div id="bossHp" class="bar-fill" style="background:var(--hp); width:100%;"></div></div>
            </div>

            <div class="glass-card">
                <button onclick="addH2O()" style="background:var(--water); width:100%;">INJECT H2O</button>
                <div class="bar-wrap"><div id="hFill" class="bar-fill" style="background:var(--water);"></div></div>
            </div>
        </aside>
    </div>
</div>

<script>
    // --- RESTORED GLOBAL STATE ---
    let state = JSON.parse(localStorage.getItem('TitanUltima_v1')) || {
        xp: 0, cals: 0, lvl: 1, prestige: 0, shards: 0, water: 0,
        bossHp: 50000, items: [], skills: []
    };

    let chart;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSfx(f, t='sine') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.8);
    }

    function save() {
        localStorage.setItem('TitanUltima_v1', JSON.stringify(state));
        updateUI();
    }

    function updateUI() {
        document.getElementById('lvl').innerText = state.lvl;
        document.getElementById('cals').innerText = state.cals;
        document.getElementById('xpDisplay').innerText = Math.floor(state.xp) + " XP";
        document.getElementById('preVal').innerText = state.prestige;
        document.getElementById('shaVal').innerText = state.shards;
        document.getElementById('xpFill').style.width = (state.xp % 2500 / 25) + "%";
        document.getElementById('bossHp').style.width = (state.bossHp / 500) + "%";
        document.getElementById('hFill').style.width = state.water + "%";
        
        // Prestige Logic
        if(state.lvl >= 20) document.getElementById('presBtn').style.display = 'block';
        if(state.prestige > 0) document.getElementById('vortex').style.display = 'block';

        // Update Hue based on Boss HP
        document.documentElement.style.setProperty('--hue', (state.bossHp / 500) + 'deg');

        if(chart) {
            chart.data.datasets[0].data = [state.cals, 3500];
            chart.update();
        }
    }

    function processData() {
        const val = document.getElementById('aiInput').value;
        if(!val) return;
        playSfx(440, 'square');
        const r = Math.random();
        let cals = Math.floor(Math.random()*800)+200;
        
        if(r > 0.95) { state.shards += 2; showToast("DIVINE DATA DETECTED"); }
        
        state.cals += cals;
        state.xp += 200 * (1 + state.prestige);
        state.bossHp = Math.max(0, state.bossHp - cals);
        
        if(state.xp >= state.lvl * 2500) {
            state.lvl++;
            playSfx(880, 'sawtooth');
            showToast("ASCENSION REACHED");
        }
        document.getElementById('aiInput').value = '';
        save();
    }

    function addH2O() {
        playSfx(600);
        state.water = Math.min(100, state.water + 10);
        state.bossHp -= 1000;
        save();
    }

    function doPrestige() {
        state.prestige++;
        state.lvl = 1; state.xp = 0; state.cals = 0;
        state.bossHp = 100000 * (state.prestige + 1);
        playSfx(200, 'square');
        save();
        location.reload();
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    window.onload = () => {
        const c = document.getElementById('coreChart').getContext('2d');
        chart = new Chart(c, {
            type: 'doughnut',
            data: { datasets: [{ data: [0, 3500], backgroundColor: ['#00d2ff', '#111'], borderWidth: 0 }] },
            options: { cutout: '85%', plugins: { tooltip: { enabled: false } } }
        });
        updateUI();
        
        // Render Inv Slots
        const inv = document.getElementById('invGrid');
        for(let i=0; i<8; i++) inv.innerHTML += `<div style="aspect-ratio:1; background:rgba(0,0,0,0.5); border:1px solid #333; border-radius:10px;"></div>`;
    };
</script>
</body>
</html>
