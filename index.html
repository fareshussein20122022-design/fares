<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN OMNI | ARCH-COSMOS UNBOUND</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1; --secondary: #ff00ff; --accent: #00d2ff;
            --water: #0080ff; --bg: #020205; --text: #fff;
            --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #ffcc00; --hp: #ff0055; --shard: #00ffaa;
            --protein: #ff4d4d; --carbs: #ffcc00; --fats: #4dff88;
        }

        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 10px; overflow-x: hidden;
            background: radial-gradient(circle at top right, #1a0033, #020205);
            min-height: 100vh; cursor: crosshair;
        }

        /* SCANLINE EFFECT */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 1000; pointer-events: none; opacity: 0.2;
        }

        .layout { display: grid; grid-template-columns: 340px 1fr 340px; gap: 15px; max-width: 1700px; margin: auto; }
        @media (max-width: 1300px) { .layout { grid-template-columns: 1fr; } }

        .glass-card { 
            background: var(--glass); backdrop-filter: blur(40px); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 20px; position: relative; overflow: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* BARS */
        .bar-wrap { height: 10px; background: #000; border-radius: 10px; overflow: hidden; margin: 5px 0; border: 1px solid #222; }
        .bar-fill { height: 100%; width: 0%; transition: 0.8s cubic-bezier(0.1, 1, 0.1, 1); }

        /* BUTTONS */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            padding: 12px; border-radius: 10px; font-family: 'Orbitron'; font-size: 0.65rem; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: var(--accent); color: #000; font-weight: 900; }

        /* INVENTORY */
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .slot { aspect-ratio: 1; background: rgba(0,0,0,0.4); border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* ARTIFACT ORBIT */
        .artifact { 
            position: absolute; width: 40px; height: 40px; background: var(--shard); 
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: orbit 4s linear infinite; display: none; filter: drop-shadow(0 0 10px var(--shard));
        }
        @keyframes orbit { from { transform: rotate(0deg) translateX(80px) rotate(0deg); } to { transform: rotate(360deg) translateX(80px) rotate(-360deg); } }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--shard); color: #000; padding: 15px 30px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; z-index: 9999; display: none; }
    </style>
</head>
<body>

<div id="toast">SYSTEM AWAKENED</div>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--glass-border); margin-bottom: 20px;">
        <h1 style="font-family: 'Syncopate'; font-size: 1.8rem; margin: 0; background: linear-gradient(45deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TITAN OMNI</h1>
        <div style="display: flex; gap: 25px; font-family: 'Orbitron'; font-size: 0.8rem;">
            <div>💰 GOLD: <span id="gold">0</span></div>
            <div>💎 SHARDS: <span id="shards">0</span></div>
            <div style="color:var(--gold)">PRESTIGE: <span id="prestige">0</span></div>
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="glass-card">
                <h3 style="margin-top:0;">🥗 MEAL ARCHITECT</h3>
                <div style="font-size:0.7rem;">PROTEIN (<span id="pVal">0</span>g)</div>
                <div class="bar-wrap"><div id="pFill" class="bar-fill" style="background:var(--protein);"></div></div>
                <div style="font-size:0.7rem;">CARBS (<span id="cVal">0</span>g)</div>
                <div class="bar-wrap"><div id="cFill" class="bar-fill" style="background:var(--carbs);"></div></div>
                <div style="font-size:0.7rem;">FATS (<span id="fVal">0</span>g)</div>
                <div class="bar-wrap"><div id="fFill" class="bar-fill" style="background:var(--fats);"></div></div>
                <div class="btn-grid">
                    <button onclick="logMeal('p')">+PRO</button>
                    <button onclick="logMeal('c')">+CARB</button>
                    <button onclick="logMeal('f')">+FAT</button>
                    <button onclick="resetMacros()" style="color:var(--hp)">RESET</button>
                </div>
            </div>

            <div class="glass-card">
                <h3>🔱 SKILL TREE</h3>
                <div class="btn-grid">
                    <button onclick="buySkill('ATK')">ATK+ (500g)</button>
                    <button onclick="buySkill('XP')">XP+ (500g)</button>
                </div>
            </div>

            <div class="glass-card">
                <h3>🎒 LOOT VOID</h3>
                <div class="inv-grid" id="inventory">
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
            </div>
        </aside>

        <main>
            <div class="glass-card" style="text-align:center; border-color: var(--hp);">
                <div id="vortex" class="artifact"></div>
                <h2 id="bossName" style="color:var(--hp); margin:0;">VOID ARCHON</h2>
                <div id="bossSprite" style="font-size: 5rem; margin: 20px 0; transition: 0.1s;">💀</div>
                <div class="bar-wrap" style="height:15px;"><div id="bossHpFill" class="bar-fill" style="background:var(--hp); width:100%;"></div></div>
                <div style="font-family:'Orbitron'; font-size:0.7rem;" id="hpText">100,000 / 100,000 HP</div>
            </div>

            <div class="glass-card">
                <h3>🏋️ TRAINING RAID</h3>
                <div class="btn-grid">
                    <button onclick="logWorkout(1)" style="border-color:var(--shard)">LOW (Recovery)</button>
                    <button onclick="logWorkout(2)" style="border-color:var(--carbs)">MODERATE</button>
                    <button onclick="logWorkout(3)" style="border-color:var(--primary)">HYPERTROPHY</button>
                    <button onclick="logWorkout(5)" style="border-color:var(--secondary)">TITAN EFFORT</button>
                </div>
                <div style="margin-top:15px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                        <span>STAMINA</span>
                        <span id="stamText">100%</span>
                    </div>
                    <div class="bar-wrap"><div id="staminaFill" class="bar-fill" style="background:var(--shard); width:100%;"></div></div>
                </div>
            </div>
        </main>

        <aside>
            <div class="glass-card" style="text-align:center;">
                <h3>ENERGY CORE</h3>
                <canvas id="coreChart" height="180"></canvas>
                <div style="font-size:1.2rem; font-weight:900; margin-top:10px;"><span id="kcal">0</span> KCAL</div>
                <div style="font-size:0.7rem; opacity:0.6;">LVL <span id="lvl">1</span> TITAN</div>
                <div class="bar-wrap"><div id="xpFill" class="bar-fill" style="background:var(--secondary);"></div></div>
            </div>

            <div class="glass-card">
                <h3>💧 HYDRA-DRIVE</h3>
                <button onclick="drink()" style="width:100%; background:var(--water); color:white; font-weight:900;">INJECT 500ML</button>
                <div class="bar-wrap" style="margin-top:10px;"><div id="waterFill" class="bar-fill" style="background:var(--water);"></div></div>
                <center><small id="waterText">0 / 3000 ML</small></center>
            </div>

            <button id="prestigeBtn" style="display:none; width:100%; padding:15px; background:var(--gold); border:none; border-radius:15px; font-family:'Orbitron'; font-weight:900; cursor:pointer;" onclick="triggerPrestige()">ASCEND REALITY</button>
        </aside>
    </div>
</div>

<script>
    // --- CONSOLIDATED GLOBAL STATE ---
    let state = JSON.parse(localStorage.getItem('TitanOmni_Final')) || {
        lvl: 1, xp: 0, gold: 0, shards: 0, prestige: 0,
        kcal: 0, water: 0, stamina: 100,
        p: 0, c: 0, f: 0,
        bossHp: 100000, bossMax: 100000,
        inv: [], skills: { atk: 1 }
    };

    let chart;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(f, t='sine') {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.6);
    }

    function save() {
        localStorage.setItem('TitanOmni_Final', JSON.stringify(state));
        updateUI();
    }

    function updateUI() {
        // Stats
        document.getElementById('lvl').innerText = state.lvl;
        document.getElementById('gold').innerText = state.gold;
        document.getElementById('shards').innerText = state.shards;
        document.getElementById('prestige').innerText = state.prestige;
        document.getElementById('kcal').innerText = state.kcal;
        
        // Macros
        document.getElementById('pVal').innerText = state.p;
        document.getElementById('cVal').innerText = state.c;
        document.getElementById('fVal').innerText = state.f;
        document.getElementById('pFill').style.width = (state.p / 2) + "%";
        document.getElementById('cFill').style.width = (state.c / 3) + "%";
        document.getElementById('fFill').style.width = (state.f / 1) + "%";

        // Bars
        document.getElementById('xpFill').style.width = (state.xp % 2000 / 20) + "%";
        document.getElementById('staminaFill').style.width = state.stamina + "%";
        document.getElementById('stamText').innerText = Math.floor(state.stamina) + "%";
        document.getElementById('waterFill').style.width = (state.water / 30) + "%";
        document.getElementById('waterText').innerText = `${state.water} / 3000 ML`;
        
        // Boss
        document.getElementById('bossHpFill').style.width = (state.bossHp / state.bossMax * 100) + "%";
        document.getElementById('hpText').innerText = `${Math.floor(state.bossHp).toLocaleString()} / ${state.bossMax.toLocaleString()} HP`;

        // Prestige & Inventory
        if(state.lvl >= 20) document.getElementById('prestigeBtn').style.display = 'block';
        if(state.prestige > 0) document.getElementById('vortex').style.display = 'block';
        
        const slots = document.querySelectorAll('.slot');
        slots.forEach((s, i) => s.innerText = state.inv[i] || '');

        if(chart) {
            chart.data.datasets[0].data = [state.kcal, 2500];
            chart.update();
        }
    }

    function logMeal(type) {
        if(type === 'p') { state.p += 25; state.kcal += 100; }
        if(type === 'c') { state.c += 40; state.kcal += 160; }
        if(type === 'f') { state.f += 10; state.kcal += 90; }
        state.xp += 100;
        playNote(440);
        checkLevel();
        save();
    }

    function logWorkout(intensity) {
        let cost = intensity * 12;
        if(state.stamina < cost) {
            showToast("LOW STAMINA! INJECT H2O.");
            return;
        }
        state.stamina -= cost;
        let dmg = intensity * 2000 * state.skills.atk * (1 + state.prestige);
        state.bossHp = Math.max(0, state.bossHp - dmg);
        state.xp += intensity * 250;
        state.gold += intensity * 100;

        // Visual Hit
        const s = document.getElementById('bossSprite');
        s.style.transform = "scale(0.7) rotate(10deg)";
        playNote(110 * intensity, 'square');
        setTimeout(() => s.style.transform = "scale(1) rotate(0deg)", 100);

        if(state.bossHp <= 0) victory();
        checkLevel();
        save();
    }

    function victory() {
        state.bossMax += 50000;
        state.bossHp = state.bossMax;
        state.shards += 2;
        const loot = ['⚔️', '🛡️', '🧪', '💎', '🔥', '🌀'][Math.floor(Math.random()*6)];
        state.inv.push(loot);
        if(state.inv.length > 10) state.inv.shift();
        showToast(`BOSS SLAIN! FOUND ${loot}`);
        playNote(880, 'sawtooth');
    }

    function drink() {
        state.water = Math.min(3000, state.water + 500);
        state.stamina = Math.min(100, state.stamina + 20);
        playNote(660);
        save();
    }

    function buySkill(type) {
        if(state.gold >= 500) {
            state.gold -= 500;
            if(type === 'ATK') state.skills.atk += 0.5;
            showToast("SKILL EVOLVED");
            save();
        }
    }

    function checkLevel() {
        if(state.xp >= state.lvl * 2000) {
            state.lvl++;
            state.shards += 1;
            showToast("LEVEL UP! +1 SHARD");
            playNote(1200, 'sine');
        }
    }

    function triggerPrestige() {
        state.prestige++;
        state.lvl = 1; state.xp = 0; state.bossMax = 100000; state.bossHp = 100000;
        state.inv = ['🌟'];
        save();
        location.reload();
    }

    function resetMacros() {
        state.p = 0; state.c = 0; state.f = 0; state.kcal = 0;
        save();
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // Passive Regen
    setInterval(() => {
        if(state.stamina < 100) {
            state.stamina = Math.min(100, state.stamina + 1.5);
            updateUI();
        }
    }, 5000);

    window.onload = () => {
        const ctx = document.getElementById('coreChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: { datasets: [{ data: [0, 2500], backgroundColor: ['#00d2ff', '#111'], borderWidth: 0 }] },
            options: { cutout: '80%', plugins: { tooltip: { enabled: false } } }
        });
        updateUI();
    };
</script>
</body>
</html>
